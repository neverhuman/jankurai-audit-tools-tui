# Generated zones for jankurai-tools-tui.
# The only generated output tree that exists in this Rust workspace is target/,
# produced by Cargo. It is never hand-edited and is regenerated by the build.

[[zone]]
path = "target/"
source = "crates/tuiwright + crates/tuiwright-cli + examples/tuiwright-demo (Cargo workspace)"
command = "cargo build --workspace --locked"
read_only = true
write_policy = "generated_output"
